<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Cardápios - Assistentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>


<div class="header">
  <div class="logo">🍽️</div>
  <div>
    <h1>Gestão de Cardápios</h1>
    <div class="subtitle">Cadastro e dashboard por assistente</div>
  </div>
</div>

<div class="container">

  <div class="card" id="form-card">
    <h2 id="form-title">Novo Registro</h2>
    <input type="hidden" id="editId">

    <label for="nome">Nome do assistente</label>
    <input type="text" id="nome" placeholder="Ex: Ana Souza">

    <label for="dataCriacao">Data de criação</label>
    <input type="date" id="dataCriacao">

    <label for="crisp">Crisp</label>
    <select id="crisp">
      <option value="sim">Sim</option>
      <option value="nao">Não</option>
    </select>

    <label for="portal">Portal</label>
    <input type="text" id="portal" placeholder="Ex: Portal XPTO">

    <label for="tipoCardapio">Tipo de cardápio</label>
    <select id="tipoCardapio">
      <option value="manual">Manual</option>
      <option value="importavel">Importável</option>
      <option value="alteracao">Alteração</option>
    </select>

    <label for="alteracao">Alteração (observações)</label>
    <input type="text" id="alteracao" placeholder="Descreva a alteração, se houver">

    <button id="saveBtn">Salvar registro</button>
    <button class="secondary" id="clearBtn">Limpar formulário</button>
  </div>

  <div class="card">
    <h2>Dashboard</h2>

    <div class="stats" id="stats"></div>

    <div class="filters">
      <input type="text" id="filterNome" placeholder="🔍 Filtrar por nome...">
      <input type="date" id="filterDataIni" title="Data inicial">
      <input type="date" id="filterDataFim" title="Data final">
      <button class="secondary" id="clearFilters">Limpar filtros</button>
    </div>

    <div style="overflow-x:auto;">
      <table id="table">
        <thead>
          <tr>
            <th>Assistente</th>
            <th>Data criação</th>
            <th>Crisp</th>
            <th>Portal</th>
            <th>Tipo cardápio</th>
            <th>Alteração</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none;">Nenhum registro encontrado.</div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
